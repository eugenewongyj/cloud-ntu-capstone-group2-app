
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  #namespace: retail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: REPLACE_WITH_IMAGE
          ports:
            - containerPort: 8080
