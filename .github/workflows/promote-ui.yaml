name: Promote UI to Production

on:
  repository_dispatch:
    types:
      - ui-staging-validated

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Staging Promotion Event
    runs-on: ubuntu-latest

    steps:
      - name: Validate notification payload
        env:
          APPLICATION: ${{ github.event.client_payload.application }}
          NAMESPACE: ${{ github.event.client_payload.namespace }}
          IMAGE_REPOSITORY: ${{ github.event.client_payload.image_repository }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          CHART_REVISION: ${{ github.event.client_payload.chart_revision }}
          SYNC_FINISHED_AT: ${{ github.event.client_payload.sync_finished_at }}
          SYNC_PHASE: ${{ github.event.client_payload.sync_phase }}

        run: |
          set -euo pipefail

          EXPECTED_REPOSITORY="255945442255.dkr.ecr.ap-southeast-1.amazonaws.com/group2-capstone-ui"

          if [[ "$APPLICATION" != "ui-staging" ]]; then
            echo "Unexpected Argo CD application"
            exit 1
          fi

          if [[ "$NAMESPACE" != "retail-staging" ]]; then
            echo "Unexpected namespace"
            exit 1
          fi

          if [[ "$SYNC_PHASE" != "Succeeded" ]]; then
            echo "Staging synchronization was unsuccessful"
            exit 1
          fi

          if [[ "$IMAGE_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Unexpected image repository"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid image tag"
            exit 1
          fi

          if [[ ! "$CHART_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid chart revision"
            exit 1
          fi

          if [[ -z "$SYNC_FINISHED_AT" ]]; then
            echo "Missing synchronization completion time"
            exit 1
          fi

          date -u -d "$SYNC_FINISHED_AT" > /dev/null

          echo "Notification payload validated successfully"

          {
            echo "## Staging Promotion Event"
            echo ""
            echo "- Application: $APPLICATION"
            echo "- Namespace: $NAMESPACE"
            echo "- Image: $IMAGE_REPOSITORY:$IMAGE_TAG"
            echo "- Chart revision: $CHART_REVISION"
            echo "- Sync finished at: $SYNC_FINISHED_AT"
            echo "- Sync phase: $SYNC_PHASE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: eugenewongyj
          repositories: cloud-ntu-capstone-group2-infra
          permission-contents: read

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: eugenewongyj/cloud-ntu-capstone-group2-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install ruamel.yaml==0.18.16

      - name: Verify staging image against Git
        env:
          IMAGE_REPOSITORY: ${{ github.event.client_payload.image_repository }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}

        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          path = Path("infra/gitops/app-staging/apps/ui-staging.yaml")

          yaml = YAML(typ="safe")

          with path.open() as f:
              data = yaml.load(f)

          image = data["spec"]["source"]["helm"]["valuesObject"]["image"]

          expected_repository = os.environ["IMAGE_REPOSITORY"]
          expected_tag = os.environ["IMAGE_TAG"]

          actual_repository = image["repository"]
          actual_tag = image["tag"]

          if actual_repository != expected_repository:
              raise ValueError(
                  "Notification image repository does not match staging manifest"
              )

          if actual_tag != expected_tag:
              raise ValueError(
                  f"Stale promotion event: "
                  f"notification tag={expected_tag}, "
                  f"current staging tag={actual_tag}"
              )

          print("Staging image verified successfully")
          print(f"Repository: {actual_repository}")
          print(f"Image tag: {actual_tag}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n## Staging Git Verification\n\n")
              f.write("- Image repository matches staging manifest\n")
              f.write("- Image tag matches staging manifest\n")
              f.write(f"- Verified image tag: {actual_tag}\n")
          PY

      - name: Configure AWS credentials for ECR verification
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "ecr:BatchGetImage",
                  "Resource": "arn:aws:ecr:ap-southeast-1:255945442255:repository/group2-capstone-ui"
                }
              ]
            }

      - name: Verify ECR image artifact
        id: verify-ecr
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}

        run: |
          set -euo pipefail

          RESPONSE=$(aws ecr batch-get-image \
            --registry-id 255945442255 \
            --repository-name group2-capstone-ui \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ap-southeast-1 \
            --output json \
            --no-cli-pager)

          if ! IMAGE_DIGEST=$(echo "$RESPONSE" | jq -er \
            --arg tag "$IMAGE_TAG" '
              select(
                (.failures | length) == 0 and
                (.images | length) == 1
              )
              | .images[0].imageId
              | select(.imageTag == $tag)
              | .imageDigest
              | select(
                  type == "string" and
                  test("^sha256:[0-9a-f]{64}$")
                )
            '); then
            echo "ECR image verification failed"
            exit 1
          fi

          echo "ECR image verified successfully"
          echo "Image tag: $IMAGE_TAG"
          echo "Image digest: $IMAGE_DIGEST"

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## ECR Artifact Verification"
            echo ""
            echo "- Image exists in ECR"
            echo "- Image tag: $IMAGE_TAG"
            echo "- Image digest: $IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"