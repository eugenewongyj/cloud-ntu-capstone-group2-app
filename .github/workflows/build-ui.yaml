
name: Build and Push UI Image

on:
  push:
    branches:
      - main
    paths:
      - "src/ui/**"
      - ".github/workflows/build-ui.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: group2-capstone-ui

jobs:
  build:
    name: Build UI Docker Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push UI image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f src/ui/Dockerfile \
            -t "$IMAGE_URI" \
            src/ui

          docker push "$IMAGE_URI"

          echo "Pushed image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"



  update-staging:
    name: Create Staging Deployment PR
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: eugenewongyj
          repositories: cloud-ntu-capstone-group2-infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: eugenewongyj/cloud-ntu-capstone-group2-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML editor
        run: python -m pip install ruamel.yaml==0.18.16

      - name: Update staging and push branch
        id: update
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          path = Path("gitops/app/apps/ui-staging.yaml")
          yaml = YAML()
          yaml.preserve_quotes = True

          with path.open() as f:
              data = yaml.load(f)

          image = data["spec"]["source"]["helm"]["valuesObject"]["image"]

          if not image["repository"].endswith("/group2-capstone-ui"):
              raise ValueError("Unexpected ECR repository")

          image["tag"] = os.environ["IMAGE_TAG"]

          with path.open("w") as f:
              yaml.dump(data, f)
          PY

          git add gitops/app/apps/ui-staging.yaml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="ci/ui-staging-${IMAGE_TAG:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git commit -m "ci: update staging UI to $IMAGE_TAG"
          git push --set-upstream origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          gh pr create \
            --repo eugenewongyj/cloud-ntu-capstone-group2-infra \
            --base main \
            --head "$BRANCH" \
            --title "ci: Update staging UI image" \
            --body "Promote UI image $IMAGE_TAG to staging."


