
name: Build and Push UI Image

on:
  push:
    branches:
      - main
    paths:
      - "src/ui/**"
      - ".github/workflows/build-ui.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: group2-capstone-ui

jobs:
  build:
    name: Build UI Docker Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push UI image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f src/ui/Dockerfile \
            -t "$IMAGE_URI" \
            src/ui

          docker push "$IMAGE_URI"

          echo "Pushed image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"


  test-gitops-access:
    name: Test GitOps Repository Access
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: eugenewongyj
          repositories: cloud-ntu-capstone-group2-infra
          permission-contents: write

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: eugenewongyj/cloud-ntu-capstone-group2-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Verify staging configuration
        run: |
          test -f infra/gitops/app/apps/ui-staging.yaml
          echo "Successfully accessed infrastructure repository."

