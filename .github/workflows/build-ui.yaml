
name: Build and Push UI Image

on:
  push:
    branches:
      - main
    paths:
      - "src/ui/**"
      - ".github/workflows/build-ui.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: group2-capstone-ui

jobs:
  build:
    name: Build UI Docker Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push UI image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f src/ui/Dockerfile \
            -t "$IMAGE_URI" \
            src/ui

          docker push "$IMAGE_URI"

          echo "Pushed image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"




  update-staging:
    name: Create Staging Deployment PR
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: eugenewongyj
          repositories: cloud-ntu-capstone-group2-infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: eugenewongyj/cloud-ntu-capstone-group2-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML editor
        run: python -m pip install ruamel.yaml==0.18.16

      - name: Update staging image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import DoubleQuotedScalarString

          path = Path("infra/gitops/app-staging/apps/ui-staging.yaml")

          yaml = YAML()
          yaml.preserve_quotes = True

          with path.open() as f:
              data = yaml.load(f)

          image = data["spec"]["source"]["helm"]["valuesObject"]["image"]

          if not image["repository"].endswith("/group2-capstone-ui"):
              raise ValueError("Unexpected ECR repository")

          image["tag"] = DoubleQuotedScalarString(os.environ["IMAGE_TAG"])

          with path.open("w") as f:
              yaml.dump(data, f)
          PY

      - name: Create staging pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          add-paths: gitops/app-staging/apps/ui-staging.yaml
          base: main
          branch: automation/ui-staging
          commit-message: "ci: update staging UI image"
          title: "ci: Update staging UI image"
          body: |
            Automated staging deployment request.

            Application commit: ${{ github.sha }}

            Image: group2-capstone-ui:${{ github.sha }}

            Review and merge to deploy through Argo CD.
          delete-branch: true

      - name: Show pull request
        if: steps.create-pr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          echo "Staging PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"



